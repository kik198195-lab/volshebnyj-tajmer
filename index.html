<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Волшебный таймер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#24324a;--card:#ffffff;--accent:#ff7a3d;--accent2:#ffb703;--ok:#3ccf6e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Nunito','Comic Sans MS','Trebuchet MS',sans-serif;font-weight:900;color:var(--ink);background:#7cc6ff;user-select:none}
button{font-family:inherit;font-weight:900;cursor:pointer;border:none}
.screen{position:fixed;inset:0;display:none}
.screen.on{display:flex}

/* ---------- фоны ---------- */
.bg{position:absolute;inset:0;z-index:0;overflow:hidden;transition:background .6s}
.bg .deco{position:absolute;pointer-events:none}
.cloud{background:#fff;border-radius:100px;opacity:.9;filter:drop-shadow(0 6px 0 rgba(0,0,0,.06))}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:160%;left:15%;top:-70%}
.cloud::after{width:40%;height:130%;right:12%;top:-45%}
.star{background:#fff8c8;border-radius:50%;box-shadow:0 0 8px #fff8c8;animation:tw 2.4s infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
.bub{border:3px solid rgba(255,255,255,.6);border-radius:50%;animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-120vh)}}

/* ---------- меню ---------- */
#menu{flex-direction:column;align-items:center;overflow-y:auto;padding:18px 16px 30px}
#menu .bg{background:linear-gradient(#69b9ff,#bfe6ff 70%,#e9f8ff)}
.menuInner{position:relative;z-index:1;width:100%;max-width:980px;display:flex;flex-direction:column;align-items:center;gap:16px}
h1{font-size:clamp(34px,6vw,64px);color:#fff;letter-spacing:1px;text-align:center;line-height:1;
  text-shadow:0 4px 0 #ff7a3d,0 8px 0 #c44f1d,0 12px 18px rgba(0,0,0,.25)}
.sub{color:#fff;font-size:clamp(15px,2.2vw,20px);text-shadow:0 2px 0 rgba(0,0,0,.2);text-align:center}
.panel{background:rgba(255,255,255,.92);border-radius:28px;padding:16px;width:100%;box-shadow:0 8px 0 rgba(36,50,74,.15),0 16px 30px rgba(0,0,0,.12)}
.panel h2{font-size:20px;margin:0 0 10px 6px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.th{position:relative;border-radius:22px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:16px;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.25);box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .15s}
.th:hover{transform:translateY(-3px)}
.th.sel{outline:5px solid #ffcf3d;transform:translateY(-3px) scale(1.04)}
.th .ic{width:74px;height:74px;display:flex;align-items:center;justify-content:center}
.th .ic>*{width:100%;height:100%}
.th small{font-size:11px;opacity:.9;font-weight:700}
.timeRow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px}
.spin{display:flex;align-items:center;gap:8px;background:#eef6ff;border-radius:22px;padding:8px}
.spin button{width:48px;height:48px;border-radius:50%;background:var(--accent2);color:#fff;font-size:30px;line-height:1;box-shadow:0 4px 0 #d28f00}
.spin button:active{transform:translateY(3px);box-shadow:0 1px 0 #d28f00}
.spin input{width:84px;height:56px;border:none;border-radius:16px;text-align:center;font:900 36px 'Nunito',sans-serif;color:var(--ink);background:#fff}
.spin label{font-size:18px;padding:0 6px}
.presets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:#fff;border:3px solid #cfe3f5;border-radius:999px;padding:8px 14px;font-size:16px;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}
.tog{background:#eef6ff;border-radius:999px;padding:8px 16px;font-size:15px;color:var(--ink)}
.tog.on{background:var(--ok);color:#fff}
.big{background:linear-gradient(#ff9a52,#ff6a2b);color:#fff;font-size:30px;padding:14px 56px;border-radius:999px;box-shadow:0 8px 0 #c44f1d,0 14px 24px rgba(0,0,0,.2);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.big:active{transform:translateY(5px);box-shadow:0 3px 0 #c44f1d}
.author{background:rgba(255,255,255,.85);border-radius:20px;padding:10px 20px;text-align:center;font-size:15px;font-weight:700;line-height:1.5;box-shadow:0 4px 0 rgba(36,50,74,.12)}
.author b{font-weight:900}.author a{color:#e1306c;font-weight:900;text-decoration:none}
.note{font-size:13px;font-weight:700;color:#5a6b85;text-align:center;margin-top:6px}

/* ---------- игра ---------- */
#game{flex-direction:column}
.top{position:relative;z-index:3;display:flex;gap:10px;padding:12px 14px;justify-content:space-between;align-items:center}
.top .grp{display:flex;gap:10px}
.rb{height:52px;min-width:52px;padding:0 18px;border-radius:999px;background:#fff;color:var(--ink);font-size:18px;display:flex;align-items:center;gap:8px;
  box-shadow:0 5px 0 rgba(0,0,0,.18)}
.rb:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.rb svg{width:24px;height:24px}
.rb.go{background:var(--ok);color:#fff}
.arena{position:relative;z-index:2;flex:1;display:flex;gap:2.5vmin;padding:0 2.5vmin 2.5vmin;min-height:0}
.board{flex:1;min-width:0;position:relative;border-radius:28px;background:rgba(255,255,255,.18);border:4px solid rgba(255,255,255,.55);
  box-shadow:inset 0 0 40px rgba(255,255,255,.15)}
.grid{position:absolute;inset:0;display:grid;place-content:center;padding:10px}
.cell{display:flex;align-items:center;justify-content:center}
.it{width:88%;height:88%;position:relative;display:flex;align-items:center;justify-content:center;animation:idle 2.6s ease-in-out infinite}
.it>svg,.it>img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 2px rgba(0,0,0,.22))}
.it.gone{visibility:hidden}
@keyframes idle{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6%) rotate(2deg)}}
.it.still{animation:none}
.side{width:clamp(200px,34vmin,420px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin}
.clock{width:100%;aspect-ratio:1;border-radius:50%;background:#fff;position:relative;display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 0 rgba(0,0,0,.15),0 20px 40px rgba(0,0,0,.2)}
.clock svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.clock .t{font-size:clamp(46px,9.5vmin,128px);letter-spacing:-1px;position:relative;font-variant-numeric:tabular-nums}
.clock.warn .t{color:#ff4d4d;animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.left{color:#fff;font-size:clamp(16px,2.6vmin,26px);text-shadow:0 2px 0 rgba(0,0,0,.25);text-align:center}
.fly{position:fixed;z-index:50;pointer-events:none}
.fly>svg,.fly>img{width:100%;height:100%;object-fit:contain}
.spark{position:fixed;z-index:51;pointer-events:none;border-radius:50%}

/* ---------- финал ---------- */
#end{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(20,30,60,.45)}
#end.on{display:flex}
.endBox{background:#fff;border-radius:36px;padding:28px 36px;text-align:center;box-shadow:0 12px 0 rgba(0,0,0,.15);animation:popIn .5s cubic-bezier(.2,1.6,.4,1)}
.endBox .em{width:150px;height:150px;margin:0 auto}
.endBox h3{font-size:clamp(34px,6vw,56px);color:var(--accent);margin:6px 0 16px}
.endBox .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
@keyframes popIn{from{transform:scale(.3);opacity:0}}
.conf{position:fixed;top:-20px;z-index:90;width:12px;height:18px;pointer-events:none}

@media (max-aspect-ratio:1/1){
  .arena{flex-direction:column-reverse}
  .side{width:100%;flex-direction:row;justify-content:center}
  .clock{width:min(42vw,30vh)}
  .left{max-width:40vw}
}
</style>
</head>
<body>

<!-- ============ МЕНЮ ============ -->
<section id="menu" class="screen on">
  <div class="bg" id="menuBg"></div>
  <div class="menuInner">
    <h1>Волшебный таймер</h1>
    <div class="sub">Каждую секунду — один улетает, лопается или убегает!</div>

    <div class="panel">
      <h2>1. Выбери героев</h2>
      <div class="themes" id="themes"></div>
    </div>

    <div class="panel">
      <h2>2. Сколько времени?</h2>
      <div class="timeRow">
        <div class="spin"><button data-d="min,-1">−</button><input id="inMin" type="number" min="0" max="60" value="0" inputmode="numeric"><button data-d="min,1">+</button><label>мин</label></div>
        <div class="spin"><button data-d="sec,-5">−</button><input id="inSec" type="number" min="0" max="59" value="30" inputmode="numeric"><button data-d="sec,5">+</button><label>сек</label></div>
      </div>
      <div class="presets" style="margin-top:12px">
        <button class="chip" data-p="10">10 сек</button><button class="chip" data-p="20">20 сек</button><button class="chip" data-p="30">30 сек</button>
        <button class="chip" data-p="60">1 мин</button><button class="chip" data-p="120">2 мин</button><button class="chip" data-p="180">3 мин</button>
        <button class="chip" data-p="300">5 мин</button><button class="chip" data-p="600">10 мин</button>
      </div>
      <div class="opts">
        <button class="tog on" id="tSound">🔊 Звук</button>
        <button class="tog" id="tRand">🎲 В случайном порядке</button>
        <button class="tog on" id="tEndSnd">🔔 Сигнал в конце</button>
      </div>
      <div class="note" id="note"></div>
    </div>

    <button class="big" id="startBtn">Поехали! ▶</button>
    <div class="author">Разработчик: <b>Курбаниязова Ильмира Климентовна</b><br>
      Instagram: <a href="https://www.instagram.com/dlya.urokov23/" target="_blank" rel="noopener">@dlya.urokov23</a></div>
  </div>
</section>

<!-- ============ ИГРА ============ -->
<section id="game" class="screen">
  <div class="bg" id="gameBg"></div>
  <div class="top">
    <div class="grp">
      <button class="rb" id="bMenu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>Меню</button>
    </div>
    <div class="grp">
      <button class="rb go" id="bPlay"><svg viewBox="0 0 24 24" id="playIc"></svg><span id="playTx">Старт</span></button>
      <button class="rb" id="bRestart"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Заново</button>
      <button class="rb" id="bFull" title="Во весь экран"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
    </div>
  </div>
  <div class="arena">
    <div class="board"><div class="grid" id="grid"></div></div>
    <div class="side">
      <div class="clock" id="clock">
        <svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#eef2f7" stroke-width="6"/>
          <circle id="ring" cx="50" cy="50" r="46" fill="none" stroke="#3ccf6e" stroke-width="6" stroke-linecap="round" stroke-dasharray="289.03" stroke-dashoffset="0"/></svg>
        <div class="t" id="time">0:30</div>
      </div>
      <div class="left" id="leftTx"></div>
    </div>
  </div>
</section>

<div id="end"><div class="endBox">
  <div class="em" id="endEm"></div>
  <h3>Время вышло!</h3>
  <div style="font-size:13px;font-weight:700;color:#5a6b85;margin:-8px 0 14px">© Курбаниязова И. К. · Instagram @dlya.urokov23</div>
  <div class="btns">
    <button class="rb go" id="eRestart">↻ Заново</button>
    <button class="rb" id="eMenu">☰ Меню</button>
  </div>
</div></div>

function paintBg(el, kind){
  el.style.background = BG[kind]; el.innerHTML='';
  const add=(cls,css)=>{const d=document.createElement('div');d.className='deco '+cls;Object.assign(d.style,css);el.appendChild(d)};
  const R=Math.random;
  if(kind==='sky'||kind==='garden'||kind==='party') for(let i=0;i<6;i++){const w=80+R()*140;add('cloud',{width:w+'px',height:w*.38+'px',left:R()*95+'%',top:(kind==='garden'?R()*30:R()*80)+'%',opacity:kind==='party'?.35:.85})}
  if(kind==='night'||kind==='space'){for(let i=0;i<70;i++){const s=1+R()*3;add('star',{width:s+'px',height:s+'px',left:R()*100+'%',top:R()*100+'%',animationDelay:R()*3+'s'})}
    if(kind==='night')add('',{width:'120px',height:'120px',right:'8%',top:'8%',borderRadius:'50%',background:'#fff6c4',boxShadow:'0 0 60px #fff6c4, inset -20px -10px 0 #efe0a0'})}
  if(kind==='sea') for(let i=0;i<18;i++){const s=8+R()*26;add('bub',{width:s+'px',height:s+'px',left:R()*100+'%',bottom:-R()*40-5+'%',animationDuration:8+R()*10+'s',animationDelay:-R()*10+'s'})}
  if(kind==='cinema') for(let i=0;i<9;i++)add('',{left:i*12+'%',top:0,width:'6%',height:'100%',background:'rgba(0,0,0,.08)'});
  if(kind==='party') for(let i=0;i<30;i++)add('',{width:'10px',height:'10px',borderRadius:'50%',left:R()*100+'%',top:R()*100+'%',background:['#fff','#ffe066','#7bdff2','#b2f7ef'][i%4],opacity:.6});
}

let AC=null; const opt={sound:true,rand:false,endSnd:true};
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); return AC;}
function tone(f1,f2,dur,type='sine',vol=.25,delay=0){const a=ac();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur,f1,f2,vol=.3,q=1.2,delay=0){const a=ac();if(!a)return;const t=a.currentTime+delay,len=a.sampleRate*dur,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.Q.value=q;f.frequency.setValueAtTime(f1,t);f.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const g=a.createGain();g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(vol,t+dur*.3);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(a.destination);s.start(t)}
const SND={
 whoosh:()=>noise(.6,300,2400,.35,1.5),
 tweet:()=>{tone(2200,3200,.08,'sine',.15);tone(2600,3600,.08,'sine',.15,.1);tone(2400,3400,.1,'sine',.13,.2)},
 pop:()=>{tone(900,180,.12,'sine',.35);noise(.05,3000,1500,.25,.8)},
 bang:()=>{noise(.18,2000,400,.5,.6);tone(220,60,.15,'triangle',.3)},
 rocket:()=>{noise(1.1,200,1200,.35,.9);tone(120,400,1,'sawtooth',.05)},
 blub:()=>{tone(300,700,.09,'sine',.25);tone(400,900,.09,'sine',.2,.12)},
 buzz:()=>{tone(180,200,.5,'sawtooth',.06);tone(186,210,.5,'sawtooth',.05)},
 boing:()=>{tone(500,120,.25,'triangle',.25,.35);tone(300,600,.15,'sine',.12,.5)},
 end:()=>{[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,f,.22,'triangle',.25,i*.14))},
 click:()=>tone(700,500,.05,'square',.06)
};
const play=k=>{ if(opt.sound&&SND[k]) SND[k]() };

/* ================= МЕНЮ ================= */
let theme=THEMES[0];
const MAXN=120;
function itemsFor(T){ if(T<=MAXN) return T; for(const n of [120,100,90,80,72,60]) if(T%n===0) return n; return 60;}
const $=id=>document.getElementById(id);
paintBg($('menuBg'),'sky');
THEMES.forEach(t=>{
  const b=document.createElement('button');b.className='th'+(t===theme?' sel':'');b.style.background=t.col;
  b.innerHTML=`<div class="ic">${art(t.art)}</div>${t.name}<small>${t.verb}</small>`;
  b.onclick=()=>{theme=t;document.querySelectorAll('.th').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');play('click')};
  $('themes').appendChild(b);
});
const inMin=$('inMin'),inSec=$('inSec');
function clampInputs(){let m=Math.max(0,Math.min(60,parseInt(inMin.value)||0)),s=Math.max(0,parseInt(inSec.value)||0);
  if(s>59){m=Math.min(60,m+Math.floor(s/60));s%=60} if(m===60)s=0; inMin.value=m;inSec.value=s;updNote()}
function total(){return (parseInt(inMin.value)||0)*60+(parseInt(inSec.value)||0)}
function updNote(){const T=total();const n=itemsFor(T);
  $('note').textContent = T<1?'Задайте время больше нуля': (n===T?`На экране будет ${n} героев — по одному на каждую секунду.`:`Время большое, поэтому на экране ${n} героев — один исчезает каждые ${fmtDur(T/n)}.`)}
function fmtDur(x){x=Math.round(x*10)/10;return x+' сек'}
document.querySelectorAll('.spin button').forEach(b=>b.onclick=()=>{const [k,d]=b.dataset.d.split(',');const el=k==='min'?inMin:inSec;let v=(parseInt(el.value)||0)+ +d;
  if(k==='sec'){if(v<0){if(+inMin.value>0){inMin.value=+inMin.value-1;v=55}else v=0}}else v=Math.max(0,v);el.value=v;clampInputs();play('click')});
[inMin,inSec].forEach(e=>e.addEventListener('change',clampInputs));
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const p=+c.dataset.p;inMin.value=Math.floor(p/60);inSec.value=p%60;updNote();play('click')});
const tog=(id,key)=>$(id).onclick=()=>{opt[key]=!opt[key];$(id).classList.toggle('on',opt[key]);play('click')};
tog('tSound','sound');tog('tRand','rand');tog('tEndSnd','endSnd');
document.querySelectorAll('.th').forEach(b=>b.addEventListener('click',updNote));
updNote();

/* ================= ИГРА ================= */
let st={T:30,N:30,per:1,elapsed:0,run:false,last:0,done:0,order:[],cells:[],raf:0,finished:false};

$('startBtn').onclick=()=>{clampInputs();if(total()<1){play('click');return}ac();startGame()};
function startGame(){
  $('menu').classList.remove('on');$('game').classList.add('on');$('end').classList.remove('on');
  paintBg($('gameBg'),theme.bg);
  st.T=total();st.N=itemsFor(st.T);st.per=st.T/st.N;
  buildGrid();resetRun();
}
function buildGrid(){
  const g=$('grid');g.innerHTML='';st.cells=[];
  for(let i=0;i<st.N;i++){const c=document.createElement('div');c.className='cell';const it=document.createElement('div');it.className='it';
    it.style.animationDelay=(-Math.random()*2.6)+'s';it.innerHTML=art(theme.art);c.appendChild(it);g.appendChild(c);st.cells.push(it)}
  layout();
}
function layout(){
  const b=$('grid').getBoundingClientRect();const W=b.width-20,H=b.height-20,n=st.N;let best=0,bc=1;
  for(let c=1;c<=n;c++){const r=Math.ceil(n/c);const s=Math.min(W/c,H/r);if(s>best){best=s;bc=c}}
  const g=$('grid');g.style.gridTemplateColumns=`repeat(${bc},${best}px)`;g.style.gridAutoRows=best+'px';
}
addEventListener('resize',()=>{if($('game').classList.contains('on'))layout()});
function resetRun(){
  cancelAnimationFrame(st.raf);st.run=false;st.elapsed=0;st.done=0;st.finished=false;
  st.order=[...Array(st.N).keys()].reverse(); // по очереди: с конца сетки
  if(opt.rand) for(let i=st.order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[st.order[i],st.order[j]]=[st.order[j],st.order[i]]}
  st.cells.forEach(it=>{it.className='it';it.innerHTML=art(theme.art)});
  document.querySelectorAll('.fly,.spark,.conf').forEach(e=>e.remove());
  $('end').classList.remove('on');setPlayBtn();draw();
}
function setPlayBtn(){
  $('playIc').innerHTML=st.run?'<path d="M7 5v14M17 5v14" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>':'<path d="M7 4l13 8-13 8z" fill="currentColor"/>';
  $('playTx').textContent=st.run?'Пауза':(st.elapsed>0&&!st.finished?'Дальше':'Старт');
  $('bPlay').classList.toggle('go',!st.run);
}
function fmt(s){s=Math.ceil(s-1e-6);const m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')}
function draw(){
  const rem=Math.max(0,st.T-st.elapsed);$('time').textContent=fmt(rem);
  const fr=rem/st.T;$('ring').style.strokeDashoffset=(289.03*(1-fr)).toFixed(2);
  $('ring').style.stroke=fr>.5?'#3ccf6e':fr>.2?'#ffb703':'#ff4d4d';
  $('clock').classList.toggle('warn',rem>0&&rem<=5&&st.run);
  const left=st.N-st.done;
  $('leftTx').textContent = theme.id==='popcorn' ? `Осталось зёрен: ${left}` : `Осталось: ${left}`;
}
function loop(now){
  if(!st.run)return;
  st.elapsed+=(now-st.last)/1000;st.last=now;
  const should=Math.min(st.N,Math.floor(st.elapsed/st.per+1e-6));
  while(st.done<should){act(st.cells[st.order[st.done]]);st.done++}
  if(st.elapsed>=st.T){st.elapsed=st.T;draw();finish();return}
  draw();st.raf=requestAnimationFrame(loop);
}
function toggle(){
  if(st.finished){resetRun()}
  st.run=!st.run;ac();
  if(st.run){st.last=performance.now();st.raf=requestAnimationFrame(loop)} else cancelAnimationFrame(st.raf);
  setPlayBtn();draw();
}
$('bPlay').onclick=toggle;
$('bRestart').onclick=()=>{play('click');resetRun()};
$('bMenu').onclick=()=>{play('click');resetRun();$('game').classList.remove('on');$('menu').classList.add('on')};
$('eRestart').onclick=()=>{resetRun();toggle()};
$('eMenu').onclick=()=>$('bMenu').onclick();
$('bFull').onclick=()=>{const d=document;if(!d.fullscreenElement)(d.documentElement.requestFullscreen||d.documentElement.webkitRequestFullscreen).call(d.documentElement).catch?.(()=>{});else d.exitFullscreen()};
addEventListener('keydown',e=>{if(!$('game').classList.contains('on'))return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.key==='r'||e.key==='к')resetRun()});

/* ================= АНИМАЦИИ ================= */
function ghost(it){
  const r=it.getBoundingClientRect();const f=document.createElement('div');f.className='fly';
  Object.assign(f.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
  f.innerHTML=art(theme.art);document.body.appendChild(f);it.classList.add('gone');return {f,r};
}
function sparks(r,colors,n=12,spread=1){
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(let i=0;i<n;i++){const s=document.createElement('div');s.className='spark';const z=4+Math.random()*r.width*.12;
    Object.assign(s.style,{width:z+'px',height:z+'px',left:cx-z/2+'px',top:cy-z/2+'px',background:colors[i%colors.length]});document.body.appendChild(s);
    const a=Math.PI*2*i/n+Math.random()*.4,d=r.width*(.5+Math.random()*.6)*spread;
    s.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.2)`,opacity:0}],{duration:500+Math.random()*250,easing:'cubic-bezier(.1,.8,.3,1)'}).onfinish=()=>s.remove()}
}
function act(it){
  if(!it)return; play(theme.snd);
  const W=innerWidth,H=innerHeight;
  const go=(f,kf,opt2)=>{f.animate(kf,{...opt2,fill:'forwards'});setTimeout(()=>f.remove(),opt2.duration+50)};
  switch(theme.act){
    case 'flyR':{const {f,r}=ghost(it);const dx=W-r.left+r.width,dy=-(r.top+r.height)-H*.1;
      go(f,[{transform:'translate(0,0) rotate(0)'},{transform:`translate(${-r.width*.2}px,${r.height*.1}px) rotate(5deg)`,offset:.12},{transform:`translate(${dx}px,${dy}px) rotate(-25deg) scale(1.4)`}],{duration:1700,easing:'cubic-bezier(.5,0,.6,1)'});break}
    case 'flap':{const {f,r}=ghost(it);const dir=Math.random()<.5?-1:1;const dx=dir*(W*.3+Math.random()*W*.4),dy=-(r.top+r.height*2);
      f.firstElementChild.animate([{transform:'scaleY(1)'},{transform:'scaleY(.65)'},{transform:'scaleY(1)'}],{duration:220,iterations:10});
      go(f,[{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx*.3}px,${dy*.15}px) scale(1.15) scaleX(${dir})`,offset:.25},{transform:`translate(${dx}px,${dy}px) scale(1.5) scaleX(${dir})`}],{duration:1900,easing:'ease-in'});break}
    case 'launch':{const {f,r}=ghost(it);const fl=f.querySelector('.flame');if(fl)fl.animate([{transform:'scaleY(1)'},{transform:'scaleY(1.8)'}],{duration:120,iterations:20,direction:'alternate',transformOrigin:'50% 79%'});
      sparks({left:r.left,top:r.top+r.height*.5,width:r.width,height:r.height},['#ffb02e','#ff6b3d','#fff3b0'],10,.6);
      go(f,[{transform:'translate(0,0)'},{transform:'translate(-3px,2px)',offset:.05},{transform:'translate(3px,0)',offset:.1},{transform:`translate(0,${-(r.top+r.height*2)}px) scale(1.3)`}],{duration:1500,easing:'cubic-bezier(.6,0,.9,.6)'});break}
    case 'swim':{const {f,r}=ghost(it);const dx=W-r.left+r.width;
      go(f,[{transform:'translate(0,0)'},{transform:`translate(${dx*.25}px,-20px)`,offset:.25},{transform:`translate(${dx*.5}px,15px)`,offset:.5},{transform:`translate(${dx*.75}px,-15px)`,offset:.75},{transform:`translate(${dx}px,0)`}],{duration:1900,easing:'ease-in'});break}
    case 'fall':{const {f,r}=ghost(it);const dy=H-r.top+r.height;
      go(f,[{transform:'translate(0,0) rotate(0)'},{transform:'translate(0,-8px) rotate(-10deg)',offset:.1},{transform:`translate(${(Math.random()-.5)*80}px,${dy}px) rotate(${(Math.random()-.5)*200}deg)`}],{duration:1300,easing:'cubic-bezier(.5,0,1,.6)'});break}
    case 'burst':{const r=it.getBoundingClientRect();it.classList.add('still');
      const a=it.animate([{transform:'scale(1)'},{transform:'scale(1.25,1.15)'},{transform:'scale(1.35)',opacity:0}],{duration:180,easing:'ease-in'});
      setTimeout(()=>it.classList.add('gone'),170);
      sparks(r,theme.id==='bubble'?['#e8fbff','#9fe3ff','#ffffff']:['#ff4f6d','#ffd166','#ffffff','#ff8fab'],14);break}
    case 'popcorn':{const r=it.getBoundingClientRect();it.classList.add('still');
      it.animate([{transform:'scale(1) rotate(0)'},{transform:'scale(.8,1.15) rotate(-8deg)'},{transform:'scale(1.1,.85) rotate(8deg)'}],{duration:160});
      setTimeout(()=>{
        it.innerHTML=art('popcorn');sparks(r,['#fff','#ffe08a','#fffaf0'],10,.8);
        it.animate([{transform:'translateY(0) scale(.4)'},{transform:'translateY(-35%) scale(1.25)'},{transform:'translateY(0) scale(1)'}],{duration:450,easing:'cubic-bezier(.2,1.4,.5,1)'})},160);
      break}
  }
}

/* ================= ФИНАЛ ================= */
function finish(){
  st.run=false;st.finished=true;setPlayBtn();$('clock').classList.remove('warn');
  if(opt.endSnd)SND.end();
  $('endEm').innerHTML=art(theme.id==='popcorn'?'popcorn':theme.art);
  setTimeout(()=>$('end').classList.add('on'),theme.id==='popcorn'?600:900);
  for(let i=0;i<80;i++){const c=document.createElement('div');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=['#ff5b5b','#ffd166','#3ccf6e','#4aa8ff','#c77dff'][i%5];
    document.body.appendChild(c);c.animate([{transform:`translateY(0) rotate(0)`},{transform:`translateY(${innerHeight+40}px) translateX(${(Math.random()-.5)*200}px) rotate(${Math.random()*900}deg)`}],{duration:2200+Math.random()*1800,delay:Math.random()*800,easing:'ease-in'}).onfinish=()=>c.remove()}
}
</script>
